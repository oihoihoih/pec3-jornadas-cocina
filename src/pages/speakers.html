    <footer class="flex flex-col items-center gap-8">
      <h5 class="text-xl font-normal">
        Si estás interesado en recibir las últimas noticias, apúntate a
        nuestra newsletter.
      </h5>
      <button type="button" data-bs-toggle="modal" data-bs-target="#newsletterModal" data-bs-whatever="@mdo">
        newsletter
      </button>

      <!-- Modal -->
      <div id="newsletterModal" tabindex="-1" aria-labelledby="newsletterModalLabel" aria-hidden="true">
        <div>
          <div>
            <div>
              <h5id="newsletterModalLabel">
                ¡Sí! Quiero recibir la newsletter
                </h5>
                <button type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div>
              <form id="newsletterForm" novalidate>
                <div>
                  <label for="email">Tu email:</label>
                  <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />
                  <div>
                    Por favor, introduce un email válido.
                  </div>
                </div>
                <div>
                  <label for="email2">Repite tu email:</label>
                  <input type="email" id="email2" name="email2" placeholder="tucorreo@ejemplo.com" required />
                  <div id="email2-feedback">
                    Por favor, repite tu email.
                  </div>
                </div>
              </form>
            </div>
            <div>
              <button type="button" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" form="newsletterForm">
                Enviar
              </button>
            </div>
          </div>
        </div>
      </div>
    </footer>
