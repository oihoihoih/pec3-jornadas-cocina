    <footer class="flex flex-col items-center gap-8">
      <h5 class="text-xl font-normal">
        Si estás interesado en recibir las últimas noticias, apúntate a
        nuestra newsletter.
      </h5>
      <button id="openModalButton" type="button" class="btn-primary" data-bs-toggle="modal" data-bs-target="#newsletterModal"
        aria-label="Open newsletter modal">
        Newsletter
      </button>


      <!-- Modal -->
      <div id="nlModalContainer" class="hidden">
        <div class="fixed inset-0 bg-black mix-blend-multiply w-full z-50"> </div>

        <div id="nlModal" class="fixed inset-0 flex items-center justify-center z-60 shadow-sm" tabindex="-1"
          aria-labelledby="newsletterModalLabel" aria-hidden="true">
          <div class="bg-white rounded-2xl w-full mx-4 md:max-w-3/4 lg:max-w-1/2">
            <div class="p-4 flex justify-between border-b border-grey-300">
              <h5 id="newsletterModalLabel">
                ¡Sí! Quiero recibir la newsletter
              </h5>

              <button id="closeModalButton" type="button" class="cursor-pointer uppercase text-grey-400 hover:text-grey"
                data-bs-dismiss="modal" aria-label="Close">X
              </button>
            </div>

            <div class="p-4">
              <form id="newsletterForm" novalidate>
                <div class="mb-4 flex flex-col">
                  <include src="./components/input.html" locals='{
                    "labelFor":"email",
                    "labelText":"Tu email",
                    "inputType":"email",
                    "inputId":"email",
                    "inputName":"email",
                    "placeholder":"tucorreo@ejemplo.com",
                    "feedbackText":"Por favor, introduce un email válido."
                  }'></include>
                </div>

                <div class="mb-4 flex flex-col">
                  <include src="./components/input.html" locals='{
                    "labelFor": "email2",
                    "labelText": "Confirma tu email",
                    "inputType": "email",
                    "inputId": "email2",
                    "inputName": "email2",
                    "placeholder": "tucorreo@ejemplo.com",
                    "feedbackText": "Los emails no coinciden."
                  }'></include>
                </div>
              </form>
            </div>

            <div class="p-4 flex flex-col border-t border-grey-300 justify-end gap-4 sm:flex-row">
              <button class="btn-cancel" type="button" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button class="btn-success" type="submit" form="newsletterForm">
                Enviar
              </button>
            </div>
          </div>
        </div>
      </div>
    </footer>
